name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch or PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every gate, once, on the development Node version. Ordered cheapest first so
  # a formatting slip does not burn a full build before it reports.
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Zero dependencies and nothing built, so it belongs with the cheap
      # gates: relative links, heading anchors, fence languages, the
      # absolute-in-README and relative-in-docs convention, and the Scripts
      # table in CONTRIBUTING.md. External URLs are never fetched.
      - name: Check documentation links
        run: npm run check:docs

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build distributables
        run: npm run build

      # After the build, because they are checked against dist/ rather than
      # against src/: a snippet that compiles only against the sources is not
      # a snippet a reader can run.
      - name: Type-check the examples
        run: npm run check:examples

      - name: Validate published entry points
        run: npm run check:exports

      - name: Enforce bundle size budget
        run: npm run size

      # Runs even when a later gate failed, provided coverage was produced.
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The contract suite against the real backend. A store adapter is trusted on
  # that suite and nothing else: the guarantee in the threat model is only as
  # strong as the store beneath it, and a mock cannot refuse a transaction for
  # contention. The suite fails rather than skips when the emulator is absent.
  firestore:
    name: Firestore emulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      # The Firestore emulator is a Java program that firebase-tools downloads
      # and runs; the runner's own JDK is not guaranteed.
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache the emulator binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firestore

      - name: Install dependencies
        run: npm ci

      - name: Run the store contract suite against the emulator
        run: >-
          npx --yes firebase-tools@15 emulators:exec --only firestore
          --project demo-purse-strings "npm run test:firestore"

  # Miniflare runs the same workerd Cloudflare runs, with the real KV
  # implementation behind it, so the contract suite exercises the platform's
  # own rules rather than a mock of them. No account and no network needed.
  cloudflare:
    name: Cloudflare (Miniflare)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the store contract suite against Miniflare
        run: npm run test:cloudflare

  # The guard is a control that other people's bills depend on, so it has to
  # behave identically on every runtime its users deploy to, not only the one
  # that built it. Windows and macOS run the newest supported Node because the
  # suite touches timers and clocks, where host behaviour differs.
  test:
    name: Test on Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22, 24, 26]
        include:
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build distributables
        run: npm run build
